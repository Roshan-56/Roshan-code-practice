# Persistent accounts, drafts, points, and contributions require a paid disk.
services:
  - type: web
    name: roshan-code-practice
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci --include=dev && npm run build && npm test
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.19.0
      - key: DATA_DIR
        value: /var/data
    disk:
      name: roshan-practice-data
      mountPath: /var/data
      sizeGB: 1
